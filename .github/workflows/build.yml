name: Build

# Every push and pull request: tests, then the Windows installer is built and
# checked (the packaged app and the installed app each run their self-test).
# The installer is attached to the run as an artifact.
# A release (tag vX.Y.Z from package.json) is published by pushing that tag,
# or by running this workflow by hand on main with "release" ticked
# (Actions → Build → Run workflow); the workflow then creates the tag itself.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release v<package.json version> from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and "v$v" -ne $env:GITHUB_REF_NAME) { throw "package.json version $v does not match tag $env:GITHUB_REF_NAME" }

      - name: Build the installer
        run: npx electron-builder --win --x64 --publish never

      - name: Update files are there
        shell: pwsh
        run: |
          foreach ($f in 'dist\latest.yml', 'dist\win-unpacked\resources\app-update.yml') { if (-not (Test-Path $f)) { throw "$f is missing" } }
          Get-Content dist\latest.yml
          Get-Content dist\win-unpacked\resources\app-update.yml

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'packaged.json'
          $p = Start-Process -FilePath 'dist\win-unpacked\RemoveBG.exe' -ArgumentList "--self-test=$out" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Install silently and self-test the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\RemoveBG-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\RemoveBG\RemoveBG.exe'
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $out = Join-Path $env:RUNNER_TEMP 'installed.json'
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test=$out" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "installed self-test failed ($($p.ExitCode))" }
          "Installer size: {0:N1} MB" -f ($setup.Length / 1MB)
          (Get-FileHash $setup.FullName -Algorithm SHA256).Hash + '  ' + $setup.Name | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RemoveBG-Windows
          path: |
            dist/RemoveBG-Setup-*.exe
            dist/RemoveBG-Setup-*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RemoveBG-Windows
          path: out

      # the same installer under a name that never changes, so
      # releases/latest/download/RemoveBG-Setup.exe always gives the newest one
      - name: Stable file name
        run: |
          cd out
          cp RemoveBG-Setup-*.exe RemoveBG-Setup.exe
          echo "$(sha256sum RemoveBG-Setup.exe | cut -d' ' -f1 | tr a-f A-F)  RemoveBG-Setup.exe" >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          # an existing tag, or v<version> created on the commit this run built
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.windows.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: RemoveBG ${{ needs.windows.outputs.version }}
          # latest.yml and the blockmap are what installed copies read to update themselves
          files: |
            out/RemoveBG-Setup-*.exe
            out/RemoveBG-Setup-*.exe.blockmap
            out/RemoveBG-Setup.exe
            out/latest.yml
            out/SHA256SUMS.txt
          generate_release_notes: true
